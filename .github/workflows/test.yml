name: Test Arena GPT
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.8', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python skills/arena/arena_setup.py --check --json
      - run: python -m unittest discover -s tests -v
      - run: python skills/arena/bracket.py plan --json
      - name: Installed bundle and real browser gates
        if: matrix.python == '3.12'
        run: python tests/smoke_bundled_archify.py
